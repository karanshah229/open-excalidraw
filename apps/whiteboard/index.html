      content="Sketch ideas, collaborate on Excalidraw boards, and connect your AI agents. Save boards locally or sign in to sync and share."
    />
    <meta property="og:image" content="https://open-excalidraw-b2ab4.web.app/social-preview.png" />

      content="Sketch ideas, collaborate on Excalidraw boards, and connect your AI agents. Save boards locally or sign in to sync and share."

    <meta name="twitter:image:alt" content="OpenExcalidraw — a whiteboard for you and your AI agents" />
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('agentic-whiteboard:theme:v1')
          var isDark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', isDark ? 'dark' : 'light')
          if (isDark) {
            root.classList.add('dark')
          } else {
            root.classList.remove('dark')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
